<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jelajah Angkasa — Misi Taufik</title>
  <meta name="description" content="Game 3D jelajah angkasa: Astronot Taufik menjelajahi planet-planet Tata Surya dengan pesawat ulang-alik canggih.">
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      overflow: hidden;
      color: #eaf4ff;
      background: #000;
      font-family: 'Inter', Arial, sans-serif;
    }

    canvas { display: block; }

    /* ── Loading Screen ── */
    #loading {
      position: fixed; inset: 0; z-index: 1000;
      background: radial-gradient(ellipse at 50% 40%, #0a1628 0%, #020408 70%);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      transition: opacity 1s ease;
    }
    #loading.fade { opacity: 0; pointer-events: none; }
    #loading h1 {
      font-family: 'Orbitron', sans-serif; font-weight: 900;
      font-size: clamp(22px, 5vw, 48px); letter-spacing: 3px;
      background: linear-gradient(135deg, #5bf1ff, #8b6cff, #ff6baa);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      margin-bottom: 12px; text-align: center;
    }
    #loading p { color: #7ba5cf; font-size: 14px; margin-bottom: 30px; }
    .loader-bar {
      width: min(320px, 80vw); height: 4px;
      background: rgba(255,255,255,.08); border-radius: 4px; overflow: hidden;
    }
    .loader-bar-inner {
      width: 0%; height: 100%;
      background: linear-gradient(90deg, #5bf1ff, #8b6cff);
      border-radius: 4px; transition: width .3s;
    }

    /* ── HUD ── */
    #hud {
      position: fixed; inset: 0; pointer-events: none; z-index: 10;
    }

    .panel {
      background: rgba(5, 12, 35, .78);
      border: 1px solid rgba(100, 180, 255, .18);
      border-radius: 14px;
      box-shadow: 0 8px 32px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.05);
      backdrop-filter: blur(12px);
    }

    #topbar {
      position: absolute; top: 12px; left: 12px; right: 12px;
      display: flex; align-items: center; justify-content: space-between;
      gap: 12px; padding: 12px 18px;
      background: rgba(5, 12, 35, .85);
      border-bottom: 1px solid rgba(91, 241, 255, .12);
    }

    #title {
      font-family: 'Orbitron', sans-serif;
      font-size: clamp(12px, 2.5vw, 18px);
      font-weight: 700; letter-spacing: 1.5px;
      background: linear-gradient(90deg, #5bf1ff, #c49fff);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    }

    .topbar-right {
      display: flex; align-items: center; gap: 12px;
    }

    .sound-btn {
      background: rgba(91, 241, 255, .1);
      border: 1px solid rgba(91, 241, 255, .3);
      color: #5bf1ff;
      border-radius: 8px;
      padding: 6px 12px;
      font-size: 11px;
      font-family: 'Orbitron', sans-serif;
      font-weight: 700;
      letter-spacing: .5px;
      cursor: pointer;
      pointer-events: auto;
      transition: all .2s;
      display: flex; align-items: center; gap: 6px;
    }
    .sound-btn:hover {
      background: rgba(91, 241, 255, .25);
      border-color: #5bf1ff;
      box-shadow: 0 0 12px rgba(91, 241, 255, .4);
    }
    .sound-btn.muted {
      color: #ff7788;
      border-color: rgba(255, 119, 136, .4);
      background: rgba(255, 119, 136, .1);
    }

    #fuel-bar-container {
      width: 120px; height: 6px; background: rgba(255,255,255,.06);
      border-radius: 4px; overflow: hidden;
    }
    #fuel-bar {
      width: 100%; height: 100%;
      background: linear-gradient(90deg, #00e5ff, #76ff03);
      border-radius: 4px; transition: width .5s;
    }

    #status {
      color: #8ec5f5; font-size: 12px; text-align: right;
      max-width: 280px;
    }

    /* ── Left Panel ── */
    #leftPanel {
      position: absolute; top: 80px; left: 12px;
      width: 210px; padding: 14px;
      pointer-events: auto; max-height: calc(100vh - 200px);
      overflow-y: auto;
    }
    #leftPanel::-webkit-scrollbar { width: 3px; }
    #leftPanel::-webkit-scrollbar-thumb { background: rgba(91,241,255,.2); border-radius: 3px; }

    #leftPanel h3 {
      font-family: 'Orbitron', sans-serif;
      font-size: 11px; font-weight: 700;
      color: #5bf1ff; letter-spacing: 1px;
      margin-bottom: 10px; text-transform: uppercase;
    }

    .planetBtn {
      width: 100%; color: #d0e8ff;
      background: rgba(30, 60, 110, .4);
      border: 1px solid rgba(91, 241, 255, .1);
      border-radius: 10px; padding: 10px 12px;
      margin: 3px 0; cursor: pointer;
      text-align: left; font-size: 12px;
      font-family: 'Inter', sans-serif;
      transition: all .25s ease;
      display: flex; align-items: center; gap: 8px;
    }
    .planetBtn:hover {
      background: rgba(91, 241, 255, .12);
      border-color: rgba(91, 241, 255, .35);
      transform: translateX(3px);
      color: #fff;
    }
    .planetBtn:disabled {
      opacity: .35; cursor: not-allowed; transform: none;
    }
    .planetBtn .dot {
      width: 10px; height: 10px; border-radius: 50%;
      display: inline-block; flex-shrink: 0;
    }

    /* ── Info Panel ── */
    #info {
      position: absolute; top: 80px; right: 12px;
      width: min(340px, calc(100vw - 240px));
      padding: 16px; display: none;
      font-size: 13px; line-height: 1.55;
      pointer-events: auto;
      max-height: calc(100vh - 200px); overflow-y: auto;
    }
    #info::-webkit-scrollbar { width: 3px; }
    #info::-webkit-scrollbar-thumb { background: rgba(91,241,255,.2); border-radius: 3px; }
    #info h3 {
      font-family: 'Orbitron', sans-serif;
      font-size: 12px; font-weight: 700;
      color: #5bf1ff; margin-bottom: 10px;
      letter-spacing: .5px;
    }
    #info p { margin: 6px 0; color: #b0cfec; }
    #info a { color: #5bf1ff; text-decoration: none; }
    #info a:hover { text-decoration: underline; }

    .stat-grid {
      display: grid; grid-template-columns: 1fr 1fr;
      gap: 6px; margin: 10px 0;
    }
    .stat-item {
      background: rgba(91,241,255,.05);
      border: 1px solid rgba(91,241,255,.08);
      border-radius: 8px; padding: 8px 10px;
      font-size: 11px;
    }
    .stat-item .label { color: #6a9ec5; font-size: 10px; }
    .stat-item .value { color: #e0f0ff; font-weight: 600; margin-top: 2px; }

    /* ── Dialog ── */
    #dialog {
      position: absolute; bottom: 90px; left: 50%;
      transform: translateX(-50%);
      width: min(700px, calc(100vw - 30px));
      padding: 20px 24px; display: none;
      line-height: 1.6; font-size: 14px;
      pointer-events: auto;
      border: 1px solid rgba(255, 100, 100, .2);
      animation: dialogPulse 3s ease infinite;
    }
    @keyframes dialogPulse {
      0%, 100% { box-shadow: 0 0 20px rgba(255,80,80,.08); }
      50% { box-shadow: 0 0 40px rgba(255,80,80,.18); }
    }
    #dialog .speaker {
      display: flex; align-items: center; gap: 10px;
      margin-bottom: 10px;
    }
    #dialog .speaker-icon {
      width: 36px; height: 36px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 20px;
      background: rgba(255,80,80,.15);
      border: 1px solid rgba(255,80,80,.3);
    }
    #dialog .speaker-name {
      font-family: 'Orbitron', sans-serif;
      font-weight: 700; font-size: 14px;
      color: #ff8a8a;
    }
    #dialog .alien-text {
      color: #d4e8f8;
      font-size: 13.5px;
      line-height: 1.6;
    }
    .tts-bar {
      display: flex; align-items: center; justify-content: space-between;
      gap: 10px; margin-top: 12px; padding: 8px 12px;
      background: rgba(15, 25, 45, .8);
      border: 1px solid rgba(255, 100, 100, .25);
      border-radius: 8px; flex-wrap: wrap;
    }
    .tts-status-box {
      display: flex; align-items: center; gap: 8px;
      font-size: 11px; color: #7ba5cf;
    }
    .tts-pulse {
      display: inline-block; width: 8px; height: 8px;
      border-radius: 50%; background: #ff4d6d;
      box-shadow: 0 0 8px #ff4d6d;
      animation: pulseDot 1s infinite alternate;
    }
    @keyframes pulseDot {
      from { opacity: 0.3; transform: scale(0.8); }
      to { opacity: 1; transform: scale(1.3); }
    }
    .tts-actions {
      display: flex; gap: 6px;
    }
    .tts-btn {
      background: rgba(255, 80, 80, .15);
      border: 1px solid rgba(255, 80, 80, .4);
      color: #ff9e9e;
      border-radius: 6px;
      padding: 4px 10px;
      font-size: 11px;
      font-family: 'Inter', sans-serif;
      cursor: pointer;
      pointer-events: auto;
      transition: all .2s;
    }
    .tts-btn:hover {
      background: rgba(255, 80, 80, .35);
      color: #fff;
      box-shadow: 0 0 10px rgba(255, 80, 80, .3);
    }
    #dialog .note {
      margin-top: 10px; padding-top: 8px;
      border-top: 1px solid rgba(255,255,255,.06);
      color: #6a9ec5; font-size: 11px;
    }
    #dialog .close-btn {
      position: absolute; top: 12px; right: 14px;
      background: none; border: none; color: #6a9ec5;
      cursor: pointer; font-size: 18px; pointer-events: auto;
      transition: color .2s;
    }
    #dialog .close-btn:hover { color: #ff6b6b; }

    /* ── Toast ── */
    #toast {
      position: absolute; left: 50%; top: 72px;
      transform: translateX(-50%);
      padding: 10px 18px;
      background: rgba(5, 15, 40, .92);
      border: 1px solid rgba(91, 241, 255, .2);
      border-radius: 24px; font-size: 13px;
      display: none; white-space: nowrap;
      animation: toastIn .3s ease;
    }
    @keyframes toastIn {
      from { opacity: 0; transform: translateX(-50%) translateY(-10px); }
      to { opacity: 1; transform: translateX(-50%) translateY(0); }
    }

    /* ── Bottom Bar ── */
    #bottom {
      position: absolute; bottom: 12px; left: 12px; right: 12px;
      display: flex; justify-content: space-between; align-items: end;
      gap: 10px;
    }

    #controls {
      padding: 12px 16px; font-size: 11px; line-height: 1.6;
      color: #7ba5cf; max-width: 55%;
    }
    #controls b { color: #5bf1ff; }
    #controls kbd {
      display: inline-block; background: rgba(91,241,255,.1);
      border: 1px solid rgba(91,241,255,.15); border-radius: 4px;
      padding: 1px 6px; font-size: 10px; color: #5bf1ff;
      font-family: 'Orbitron', monospace;
    }

    #actions {
      padding: 12px 14px; pointer-events: auto;
      min-width: 180px;
    }

    button.action {
      width: 100%; color: #fff;
      background: linear-gradient(135deg, rgba(91,241,255,.15), rgba(139,108,255,.15));
      border: 1px solid rgba(91,241,255,.25);
      border-radius: 10px; padding: 11px 14px;
      cursor: pointer; text-align: center;
      font-family: 'Orbitron', sans-serif;
      font-size: 11px; font-weight: 700;
      letter-spacing: .5px;
      transition: all .25s ease;
    }
    button.action:hover {
      background: linear-gradient(135deg, rgba(91,241,255,.25), rgba(139,108,255,.25));
      border-color: rgba(91,241,255,.5);
      box-shadow: 0 0 20px rgba(91,241,255,.15);
    }

    button.action-secondary {
      width: 100%; color: #8ec5f5;
      background: rgba(255,255,255,.04);
      border: 1px solid rgba(255,255,255,.08);
      border-radius: 8px; padding: 8px 12px;
      cursor: pointer; text-align: center;
      font-family: 'Inter', sans-serif;
      font-size: 11px; margin-top: 6px;
      transition: all .2s ease;
    }
    button.action-secondary:hover {
      background: rgba(255,100,100,.1);
      border-color: rgba(255,100,100,.25);
      color: #ffaaaa;
    }

    /* ── Mobile Touch ── */
    #touchControls {
      display: none;
      position: absolute; bottom: 80px; left: 14px;
      pointer-events: auto;
    }
    .touch-btn {
      width: 48px; height: 48px; border-radius: 50%;
      background: rgba(91,241,255,.12);
      border: 1px solid rgba(91,241,255,.2);
      color: #5bf1ff; font-size: 18px;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; user-select: none;
      -webkit-user-select: none;
      touch-action: none;
    }
    .touch-grid {
      display: grid;
      grid-template-areas: ". up ." "left . right" ". down .";
      grid-template-columns: 52px 52px 52px;
      grid-template-rows: 52px 52px 52px;
      gap: 2px;
    }
    .touch-grid .up { grid-area: up; }
    .touch-grid .down { grid-area: down; }
    .touch-grid .left { grid-area: left; }
    .touch-grid .right { grid-area: right; }

    /* ── Speed Lines Overlay ── */
    #speedLines {
      position: fixed; inset: 0; pointer-events: none; z-index: 5;
      opacity: 0; transition: opacity .5s;
    }

    @media (max-width: 700px) {
      #leftPanel { width: 160px; padding: 10px; top: 74px; }
      .planetBtn { padding: 8px 10px; font-size: 11px; }
      #topbar { padding: 10px 14px; }
      #status { font-size: 10px; max-width: 150px; }
      #controls { max-width: 50%; font-size: 9px; padding: 8px 10px; }
      #actions { min-width: 150px; }
      #info { top: auto; bottom: 160px; width: min(300px, calc(100vw - 24px)); }
      #touchControls { display: block; }
      #fuel-bar-container { width: 60px; }
    }

    @media (max-width: 400px) {
      #leftPanel { width: 130px; }
      #info { width: calc(100vw - 20px); }
    }
  </style>
</head>

<body>
  <!-- Loading Screen -->
  <div id="loading">
    <h1>🚀 JELAJAH ANGKASA</h1>
    <p>Misi Astronot Taufik</p>
    <div class="loader-bar">
      <div class="loader-bar-inner" id="loadBar"></div>
    </div>
  </div>

  <!-- Speed Lines Canvas -->
  <canvas id="speedLines"></canvas>

  <!-- HUD -->
  <div id="hud" style="display:none">
    <div id="topbar" class="panel">
      <div id="title">🚀 MISI TAUFIK</div>
      <div id="fuel-bar-container" title="Bahan Bakar Pesawat">
        <div id="fuel-bar"></div>
      </div>
      <div class="topbar-right">
        <button id="soundToggleBtn" class="sound-btn" title="Aktifkan / Matikan Suara (M)">🔊 SUARA ON</button>
        <div id="status">Menyiapkan pesawat ulang-alik...</div>
      </div>
    </div>

    <div id="leftPanel" class="panel">
      <h3>🪐 Tujuan Ekspedisi</h3>
      <div id="planetList"></div>
    </div>

    <div id="info" class="panel"></div>
    <div id="toast"></div>
    <div id="dialog" class="panel"></div>

    <div id="touchControls">
      <div class="touch-grid">
        <div class="touch-btn up" data-key="w">▲</div>
        <div class="touch-btn left" data-key="a">◀</div>
        <div class="touch-btn right" data-key="d">▶</div>
        <div class="touch-btn down" data-key="s">▼</div>
      </div>
    </div>

    <div id="bottom">
      <div id="controls" class="panel">
        <b>Kontrol:</b> Pilih planet untuk terbang · <kbd>E</kbd> mendarat / bicara ·
        <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> berjalan ·
        <kbd>Esc</kbd> tutup dialog · <kbd>R</kbd> kembali ke pesawat
      </div>
      <div id="actions" class="panel">
        <button class="action" id="mainAction">PILIH PLANET</button>
        <button class="action-secondary" id="returnBtn" style="display:none">↩ Kembali ke Orbit</button>
      </div>
    </div>
  </div>

  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"
      }
    }
  </script>

  <script type="module">
    import * as THREE from "three";

    /* ═══════════════════════════════════════════
       SCENE SETUP
    ═══════════════════════════════════════════ */
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x000005);

    const camera = new THREE.PerspectiveCamera(
      55, window.innerWidth / window.innerHeight, 0.1, 8000
    );

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.0;
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    document.body.appendChild(renderer.domElement);

    /* ═══════════════════════════════════════════
       LIGHTING
    ═══════════════════════════════════════════ */
    const ambientLight = new THREE.AmbientLight(0x3a5070, 1.2);
    scene.add(ambientLight);

    const hemiLight = new THREE.HemisphereLight(0x88aadd, 0x445566, 0.8);
    scene.add(hemiLight);

    const sunLight = new THREE.PointLight(0xfff0d4, 4, 3000, 1.2);
    sunLight.position.set(0, 0, 0);
    sunLight.castShadow = true;
    scene.add(sunLight);

    const fillLight = new THREE.DirectionalLight(0x6699cc, 0.6);
    fillLight.position.set(-100, 80, 100);
    scene.add(fillLight);

    const fillLight2 = new THREE.DirectionalLight(0x445588, 0.4);
    fillLight2.position.set(100, 40, -80);
    scene.add(fillLight2);

    // Follow light - moves with shuttle or player
    const followLight = new THREE.PointLight(0xffffff, 2.5, 80, 1.5);
    followLight.position.set(0, 20, 0);
    scene.add(followLight);

    // Landing/walking area light
    const landingLight = new THREE.PointLight(0xffffff, 0, 60, 1.5);
    scene.add(landingLight);

    /* ═══════════════════════════════════════════
       PLANET DATA (NASA-referenced facts)
    ═══════════════════════════════════════════ */
    const planets = [
      {
        name: "Merkurius", size: 3.8, orbitRadius: 55, orbitSpeed: 0.48, color: 0x8c7c6a, type: "rock",
        tilt: 0.034, rotSpeed: 0.004,
        skyColor: 0x221d18, fogColor: 0x362c24, fogDensity: 0.006, sunLightColor: 0xfff4e6,
        windProfile: { freq: 160, q: 1.0, gain: 0.04, rumble: 0.02, name: "Desis Radiasi Matahari Silau" },
        stats: { diameter: "4.879 km", suhu: "-180°C ~ 430°C", gravitasi: "3.7 m/s²", hari: "59 hari Bumi" },
        info: "Planet terkecil dan terdekat dari Matahari. Permukaannya penuh kawah akibat tumbukan asteroid selama miliaran tahun. Tidak punya atmosfer pelindung sehingga siang sangat panas (430°C) dan malam sangat dingin (-180°C). Merkurius memiliki inti besi besar yang membentuk ~85% radiusnya.",
        alien: "BERHENTI, manusia kecil! Aku adalah Xarvok, Penjaga Kawah Merkurius! Lihatlah duniaku — permukaan penuh kawah yang menyimpan catatan kosmik dari masa awal Tata Surya. Di sini, siang hari bisa membakarmu hingga 430°C, dan malam hari akan membekukanmu sampai -180°C! Jangan kira kau bisa bertahan di sini. Di balik kawah-kawah ini tersimpan inti besi raksasa — harta karun yang takkan pernah bisa kau gali. Pergi sebelum rotasiku yang lambat membuat satu harimu menjadi 59 hari Bumi yang menyiksa!",
        alienName: "Xarvok",
        alienColor: 0x4a3a2a,
        alienEyeColor: 0xff4400,
        source: "https://solarsystem.nasa.gov/planets/mercury/overview/"
      },
      {
        name: "Venus", size: 5.5, orbitRadius: 85, orbitSpeed: 0.35, color: 0xd4a24e, type: "venus",
        tilt: 2.64, rotSpeed: -0.002,
        skyColor: 0xd89f38, fogColor: 0xba8024, fogDensity: 0.018, sunLightColor: 0xffcc66,
        windProfile: { freq: 280, q: 4.5, gain: 0.16, rumble: 0.12, name: "Desau Badai Asam Sulfat Pekat" },
        stats: { diameter: "12.104 km", suhu: "~465°C", gravitasi: "8.87 m/s²", tekanan: "92× Bumi" },
        info: "Venus diselimuti atmosfer karbon dioksida sangat tebal dengan awan asam sulfat. Efek rumah kaca yang ekstrem menjadikannya planet terpanas di Tata Surya (~465°C). Tekanan atmosfernya 92 kali Bumi — setara tekanan di kedalaman 900m di laut. Venus berotasi terbalik (retrograde) dan sangat lambat.",
        alien: "Selamat datang di NERAKAKU, Taufik! Aku Sulfara, Ratu Awan Asam! Kau pikir planetmu panas? HA! Di sini suhunya 465°C — cukup untuk melelehkan timah dan seng! Atmosfer karbon dioksidaku begitu tebal, tekanannya 92 kali lipat Bumiku! Hujan asam sulfat turun dari awan-awanku, meski menguap sebelum menyentuh tanah. Ratusan gunung berapi tersebar di permukaanku. Dan yang paling menarik — aku berotasi TERBALIK! Matahari terbit di barat dan tenggelam di timur. Satu hariku setara 243 hari Bumi. Pergi dari sini sebelum atmosferku meremukkanmu!",
        alienName: "Sulfara",
        alienColor: 0x8a6520,
        alienEyeColor: 0xffaa00,
        source: "https://solarsystem.nasa.gov/planets/venus/overview/"
      },
      {
        name: "Bumi", size: 5.8, orbitRadius: 120, orbitSpeed: 0.3, color: 0x2266bb, type: "earth",
        tilt: 0.41, rotSpeed: 0.01,

    /* ═══════════════════════════════════════════
       TEXTURE GENERATION
    ═══════════════════════════════════════════ */
    function makeTexture(baseColor, type, size = 1024) {
      const c = document.createElement("canvas");
      c.width = size; c.height = size / 2;
      const ctx = c.getContext("2d");
      const base = "#" + new THREE.Color(baseColor).getHexString();

      // Base fill
      ctx.fillStyle = base;
      ctx.fillRect(0, 0, c.width, c.height);

      // Noise layer
      for (let i = 0; i < 4000; i++) {
        const x = Math.random() * c.width;
        const y = Math.random() * c.height;
        const r = Math.random() * (type === "bands" ? 12 : 6) + 0.5;
        const a = Math.random() * 0.18;
        ctx.fillStyle = Math.random() > .5
          ? `rgba(255,255,255,${a})`
          : `rgba(0,0,0,${a})`;
        ctx.beginPath();
        ctx.ellipse(x, y, r * 2, r, Math.random() * Math.PI, 0, Math.PI * 2);
        ctx.fill();
      }

      if (type === "rock") {
        // Craters
        for (let i = 0; i < 200; i++) {
          const cx = Math.random() * c.width;
          const cy = Math.random() * c.height;
          const cr = 2 + Math.random() * 15;
          ctx.beginPath();
          ctx.arc(cx, cy, cr, 0, Math.PI * 2);
          ctx.fillStyle = `rgba(0,0,0,${0.08 + Math.random() * 0.12})`;
          ctx.fill();
          ctx.beginPath();
          ctx.arc(cx - cr * 0.2, cy - cr * 0.2, cr * 0.7, 0, Math.PI * 2);
          ctx.fillStyle = `rgba(255,255,255,${0.03 + Math.random() * 0.05})`;
          ctx.fill();
        }
      }

      if (type === "venus") {
        // Thick swirling clouds
        for (let y = 0; y < c.height; y += 3) {
          const wave = Math.sin(y * 0.02) * 40;
          ctx.fillStyle = `rgba(220,180,100,${0.03 + Math.random() * 0.06})`;
          ctx.fillRect(wave, y, c.width, 2 + Math.random() * 4);
        }
        for (let i = 0; i < 80; i++) {
          ctx.beginPath();
          const sx = Math.random() * c.width;
          const sy = Math.random() * c.height;
          ctx.ellipse(sx, sy, 30 + Math.random() * 80, 5 + Math.random() * 15,
            Math.random() * 0.3, 0, Math.PI * 2);
          ctx.fillStyle = `rgba(240,200,120,${0.04 + Math.random() * 0.06})`;
          ctx.fill();
        }
      }

      if (type === "earth") {
        // Land masses
        const landColor = "rgba(45,130,60,.85)";
        for (let i = 0; i < 120; i++) {
          ctx.beginPath();
          ctx.ellipse(
            Math.random() * c.width, Math.random() * c.height,
            10 + Math.random() * 50, 5 + Math.random() * 25,
            Math.random() * Math.PI, 0, Math.PI * 2
          );
          ctx.fillStyle = landColor;
          ctx.fill();
        }
        // Ice caps
        ctx.fillStyle = "rgba(230,245,255,.8)";
        ctx.fillRect(0, 0, c.width, 20 + Math.random() * 15);
        ctx.fillRect(0, c.height - 25, c.width, 25);
        // Clouds
        for (let i = 0; i < 150; i++) {
          ctx.beginPath();
          ctx.ellipse(
            Math.random() * c.width, Math.random() * c.height,
            10 + Math.random() * 40, 2 + Math.random() * 5,
            Math.random(), 0, Math.PI * 2
          );
          ctx.fillStyle = `rgba(255,255,255,${0.15 + Math.random() * 0.2})`;
          ctx.fill();
        }
      }

      if (type === "mars") {
        // Craters and valleys
        for (let i = 0; i < 150; i++) {
          ctx.beginPath();
          ctx.arc(Math.random() * c.width, Math.random() * c.height,
            2 + Math.random() * 12, 0, Math.PI * 2);
          ctx.fillStyle = `rgba(60,20,10,${0.1 + Math.random() * 0.15})`;
          ctx.fill();
        }
        // Polar ice
        ctx.fillStyle = "rgba(220,230,240,.5)";
        ctx.fillRect(0, 0, c.width, 12);
        ctx.fillRect(0, c.height - 12, c.width, 12);
        // Olympus Mons hint
        ctx.beginPath();
        ctx.arc(c.width * 0.3, c.height * 0.35, 30, 0, Math.PI * 2);
        ctx.fillStyle = "rgba(180,100,60,.2)";
        ctx.fill();
      }

      if (type === "bands") {
        // Gas giant bands
        for (let y = 0; y < c.height; y += 4 + Math.random() * 12) {
          const colors = ["255,230,190", "180,140,90", "200,160,100", "140,100,70", "220,180,130"];
          const col = colors[Math.floor(Math.random() * colors.length)];
          ctx.fillStyle = `rgba(${col},${0.08 + Math.random() * 0.15})`;
          const h = 3 + Math.random() * 15;
          ctx.fillRect(0, y, c.width, h);
        }
        // Great Red Spot for Jupiter
        if (baseColor === 0xc4956a) {
          ctx.beginPath();
          ctx.ellipse(c.width * 0.6, c.height * 0.55, 45, 25, 0.1, 0, Math.PI * 2);
          ctx.fillStyle = "rgba(200,80,40,.35)";
          ctx.fill();
          ctx.beginPath();
          ctx.ellipse(c.width * 0.6, c.height * 0.55, 30, 15, 0.1, 0, Math.PI * 2);
          ctx.fillStyle = "rgba(220,60,30,.25)";
          ctx.fill();
        }
      }

      if (type === "ice") {
        // Ice giant atmosphere
        for (let y = 0; y < c.height; y += 8 + Math.random() * 20) {
          ctx.fillStyle = `rgba(200,240,255,${0.03 + Math.random() * 0.06})`;
          ctx.fillRect(0, y, c.width, 2 + Math.random() * 6);
        }
        for (let i = 0; i < 40; i++) {
          ctx.beginPath();
          ctx.ellipse(
            Math.random() * c.width, Math.random() * c.height,
            20 + Math.random() * 60, 5 + Math.random() * 10,
            Math.random() * 0.5, 0, Math.PI * 2
          );
          ctx.fillStyle = `rgba(180,220,255,${0.03 + Math.random() * 0.05})`;
          ctx.fill();
        }
      }

      const tex = new THREE.CanvasTexture(c);
      tex.colorSpace = THREE.SRGBColorSpace;
      return tex;
    }

    function makeBumpMap(baseColor, type) {
      const c = document.createElement("canvas");
      c.width = 512; c.height = 256;
      const ctx = c.getContext("2d");
      ctx.fillStyle = "#808080";
      ctx.fillRect(0, 0, c.width, c.height);

      for (let i = 0; i < 2000; i++) {
        const x = Math.random() * c.width;
        const y = Math.random() * c.height;
        const r = Math.random() * 8 + 1;
        const v = Math.floor(100 + Math.random() * 80);
        ctx.fillStyle = `rgb(${v},${v},${v})`;
        ctx.beginPath();
        ctx.arc(x, y, r, 0, Math.PI * 2);
        ctx.fill();
      }

      if (type === "rock" || type === "mars") {
        for (let i = 0; i < 100; i++) {
          const cx = Math.random() * c.width;
          const cy = Math.random() * c.height;
          const cr = 3 + Math.random() * 15;
          ctx.beginPath();
          ctx.arc(cx, cy, cr, 0, Math.PI * 2);
          ctx.fillStyle = `rgba(40,40,40,${0.3 + Math.random() * 0.3})`;
          ctx.fill();
        }
      }

      return new THREE.CanvasTexture(c);
    }

    /* ═══════════════════════════════════════════
       STARS (multi-layer)
    ═══════════════════════════════════════════ */
    function createStarfield() {
      // Far stars
      const count1 = 12000;
      const pos1 = new Float32Array(count1 * 3);
      const sizes1 = new Float32Array(count1);
      const colors1 = new Float32Array(count1 * 3);
      const starColors = [
        new THREE.Color(0xffffff),
        new THREE.Color(0xaaccff),
        new THREE.Color(0xffddaa),
        new THREE.Color(0xffaaaa),
        new THREE.Color(0xaaffff),
      ];
      for (let i = 0; i < count1; i++) {
        const theta = Math.random() * Math.PI * 2;
        const phi = Math.acos(2 * Math.random() - 1);
        const r = 1500 + Math.random() * 2500;
        pos1[i * 3] = r * Math.sin(phi) * Math.cos(theta);
        pos1[i * 3 + 1] = r * Math.sin(phi) * Math.sin(theta);
        pos1[i * 3 + 2] = r * Math.cos(phi);
        sizes1[i] = 0.3 + Math.random() * 1.5;
        const sc = starColors[Math.floor(Math.random() * starColors.length)];
        colors1[i * 3] = sc.r;
        colors1[i * 3 + 1] = sc.g;
        colors1[i * 3 + 2] = sc.b;
      }
      const geo1 = new THREE.BufferGeometry();
      geo1.setAttribute("position", new THREE.BufferAttribute(pos1, 3));
      geo1.setAttribute("size", new THREE.BufferAttribute(sizes1, 1));
      geo1.setAttribute("color", new THREE.BufferAttribute(colors1, 3));
      const stars1 = new THREE.Points(geo1, new THREE.PointsMaterial({
        size: 0.8, vertexColors: true, sizeAttenuation: true, transparent: true, opacity: 0.9
      }));
      scene.add(stars1);

      // Near twinkle stars
      const count2 = 3000;
      const pos2 = new Float32Array(count2 * 3);
      for (let i = 0; i < count2; i++) {
        pos2[i * 3] = (Math.random() - 0.5) * 3000;
        pos2[i * 3 + 1] = (Math.random() - 0.5) * 1500;
        pos2[i * 3 + 2] = (Math.random() - 0.5) * 3000;
      }
      const geo2 = new THREE.BufferGeometry();
      geo2.setAttribute("position", new THREE.BufferAttribute(pos2, 3));
      const stars2 = new THREE.Points(geo2, new THREE.PointsMaterial({
        color: 0xeef4ff, size: 0.4, transparent: true, opacity: 0.6
      }));
      scene.add(stars2);
      return { stars1, stars2 };
    }

    const { stars1, stars2 } = createStarfield();

    /* ═══════════════════════════════════════════
       SUN
    ═══════════════════════════════════════════ */
    function createSun() {
      const group = new THREE.Group();

      // Core
      const sunGeo = new THREE.SphereGeometry(20, 64, 64);
      const sunMat = new THREE.MeshBasicMaterial({
        color: 0xffdd44,
        emissive: 0xffaa00
      });
      const sunMesh = new THREE.Mesh(sunGeo, sunMat);
      group.add(sunMesh);

      // Inner glow
      const glow1 = new THREE.Mesh(
        new THREE.SphereGeometry(23, 32, 32),
        new THREE.MeshBasicMaterial({
          color: 0xffaa33, transparent: true, opacity: 0.3, side: THREE.BackSide
        })
      );
      group.add(glow1);

      // Outer glow
      const glow2 = new THREE.Mesh(
        new THREE.SphereGeometry(30, 32, 32),
        new THREE.MeshBasicMaterial({
          color: 0xff8800, transparent: true, opacity: 0.08, side: THREE.BackSide
        })
      );
      group.add(glow2);

      // Corona
      const glow3 = new THREE.Mesh(
        new THREE.SphereGeometry(40, 32, 32),
        new THREE.MeshBasicMaterial({
          color: 0xff6600, transparent: true, opacity: 0.03, side: THREE.BackSide
        })
      );
      group.add(glow3);

      scene.add(group);
      return { group, mesh: sunMesh, glows: [glow1, glow2, glow3] };
    }

    const sun = createSun();

    /* ═══════════════════════════════════════════
       ORBITS
    ═══════════════════════════════════════════ */
    function makeOrbit(radius) {
      const curve = new THREE.EllipseCurve(0, 0, radius, radius, 0, Math.PI * 2, false, 0);
      const pts = curve.getPoints(200).map(p => new THREE.Vector3(p.x, 0, p.y));
      const geo = new THREE.BufferGeometry().setFromPoints(pts);
      const orbit = new THREE.LineLoop(geo, new THREE.LineBasicMaterial({
        color: 0x1a2a4a, transparent: true, opacity: 0.35
      }));
      scene.add(orbit);
    }

    /* ═══════════════════════════════════════════
       CREATE PLANETS
    ═══════════════════════════════════════════ */
    const planetMeshes = [];
    const planetGroups = [];

    planets.forEach((p, i) => {
      makeOrbit(p.orbitRadius);

      const geo = new THREE.SphereGeometry(p.size, 64, 64);
      const mat = new THREE.MeshStandardMaterial({
        map: makeTexture(p.color, p.type),
        bumpMap: makeBumpMap(p.color, p.type),
        bumpScale: p.type === "rock" || p.type === "mars" ? 0.3 : 0.05,
        roughness: p.type === "bands" || p.type === "ice" ? 0.6 : 0.85,
        metalness: 0.02,
      });

      const mesh = new THREE.Mesh(geo, mat);
      mesh.castShadow = true;
      mesh.receiveShadow = true;

      // Planet orbit group (rotates around sun)
      const orbitGroup = new THREE.Group();
      mesh.position.set(p.orbitRadius, 0, 0);
      orbitGroup.add(mesh);

      // Initial random orbit position
      const startAngle = Math.random() * Math.PI * 2;
      orbitGroup.rotation.y = startAngle;
      p._orbitAngle = startAngle;

      scene.add(orbitGroup);
      p.mesh = mesh;
      p.orbitGroup = orbitGroup;
      planetMeshes.push(mesh);
      planetGroups.push(orbitGroup);

      // Atmosphere for Earth
      if (p.name === "Bumi") {
        const atmo = new THREE.Mesh(
          new THREE.SphereGeometry(p.size * 1.03, 48, 48),
          new THREE.MeshStandardMaterial({
            color: 0x6699ff, transparent: true, opacity: 0.15,
            side: THREE.FrontSide, roughness: 1
          })
        );
        mesh.add(atmo);

        // Moon
        const moonGeo = new THREE.SphereGeometry(1.2, 32, 32);
        const moonMat = new THREE.MeshStandardMaterial({ color: 0xcccccc, roughness: 0.9 });
        const moon = new THREE.Mesh(moonGeo, moonMat);
        moon.position.set(12, 1, 0);
        mesh.add(moon);
        p._moon = moon;
      }

      // Rings for Saturn
      if (p.hasRing) {
        const ringGeo = new THREE.RingGeometry(p.size * 1.3, p.size * 2.2, 128);
        // Color the ring
        const ringCanvas = document.createElement("canvas");
        ringCanvas.width = 512; ringCanvas.height = 64;
        const rctx = ringCanvas.getContext("2d");
        const grad = rctx.createLinearGradient(0, 0, 512, 0);
        grad.addColorStop(0, "rgba(200,180,140,0.1)");
        grad.addColorStop(0.15, "rgba(210,190,150,0.8)");
        grad.addColorStop(0.3, "rgba(180,160,120,0.3)");
        grad.addColorStop(0.45, "rgba(200,180,140,0.9)");
        grad.addColorStop(0.6, "rgba(170,150,110,0.4)");
        grad.addColorStop(0.75, "rgba(190,170,130,0.7)");
        grad.addColorStop(1, "rgba(160,140,100,0.05)");
        rctx.fillStyle = grad;
        rctx.fillRect(0, 0, 512, 64);
        // Add bands
        for (let y = 0; y < 64; y += 2) {
          rctx.fillStyle = `rgba(${150 + Math.random() * 60},${130 + Math.random() * 50},${80 + Math.random() * 40},${Math.random() * 0.3})`;
          rctx.fillRect(0, y, 512, 1);
        }
        const ringTex = new THREE.CanvasTexture(ringCanvas);

        const ringMat = new THREE.MeshStandardMaterial({
          map: ringTex, side: THREE.DoubleSide,
          transparent: true, opacity: 0.8, roughness: 0.8
        });
        const ring = new THREE.Mesh(ringGeo, ringMat);
        ring.rotation.x = Math.PI / 2.3;
        mesh.add(ring);
      }

      // Atmosphere glow for gas giants
      if (p.type === "bands" || p.type === "ice") {
        const atmoGlow = new THREE.Mesh(
          new THREE.SphereGeometry(p.size * 1.04, 32, 32),
          new THREE.MeshBasicMaterial({
            color: p.color, transparent: true, opacity: 0.06, side: THREE.BackSide
          })
        );
        mesh.add(atmoGlow);
      }

      // Landing pad (kept small, terrain added dynamically)
      const padGroup = new THREE.Group();
      const pad = new THREE.Mesh(
        new THREE.CircleGeometry(16, 64),
        new THREE.MeshStandardMaterial({
          color: 0x333340, roughness: 0.95, metalness: 0.1
        })
      );
      pad.rotation.x = -Math.PI / 2;
      padGroup.add(pad);

      // Landing pad markings
      const markRing = new THREE.Mesh(
        new THREE.RingGeometry(6, 6.5, 48),
        new THREE.MeshStandardMaterial({ color: 0x5bf1ff, emissive: 0x2a6a8a, emissiveIntensity: 0.5, side: THREE.DoubleSide })
      );
      markRing.rotation.x = -Math.PI / 2;
      markRing.position.y = 0.02;
      padGroup.add(markRing);

      padGroup.position.set(p.orbitRadius, p.size + 0.04, 0);
      orbitGroup.add(padGroup);
      p._pad = padGroup;

      // --- BIG TERRAIN GROUND (visible when landed) ---
      // Create a large ground plane for each planet so it looks like you're ON the surface
      const groundColors = {
        'Merkurius': 0x7a6a5a, 'Venus': 0x8a7040, 'Bumi': 0x3a7a4a,
        'Mars': 0x9a4a2a, 'Jupiter': 0x8a7050, 'Saturnus': 0x9a8a5a,
        'Uranus': 0x4a8a8a, 'Neptunus': 0x2a3a7a
      };
      const gColor = groundColors[p.name] || 0x555555;

      // Create terrain texture
      const terrainCanvas = document.createElement('canvas');
      terrainCanvas.width = 1024; terrainCanvas.height = 1024;
      const tctx = terrainCanvas.getContext('2d');
      tctx.fillStyle = '#' + new THREE.Color(gColor).getHexString();
      tctx.fillRect(0, 0, 1024, 1024);
      // Add noise/details
      for (let ti = 0; ti < 5000; ti++) {
        const tx = Math.random() * 1024;
        const ty = Math.random() * 1024;
        const tr = 1 + Math.random() * 8;
        const ta = Math.random() * 0.15;
        tctx.fillStyle = Math.random() > 0.5 ? `rgba(255,255,255,${ta})` : `rgba(0,0,0,${ta})`;
        tctx.beginPath();
        tctx.arc(tx, ty, tr, 0, Math.PI * 2);
        tctx.fill();
      }
      // Craters for rocky planets
      if (['Merkurius','Venus','Mars','Bumi'].includes(p.name)) {
        for (let ci = 0; ci < 60; ci++) {
          const cx2 = Math.random() * 1024;
          const cy2 = Math.random() * 1024;
          const cr2 = 5 + Math.random() * 25;
          tctx.beginPath();
          tctx.arc(cx2, cy2, cr2, 0, Math.PI * 2);
          tctx.fillStyle = `rgba(0,0,0,${0.05 + Math.random() * 0.1})`;
          tctx.fill();
          tctx.beginPath();
          tctx.arc(cx2 - 2, cy2 - 2, cr2 * 0.6, 0, Math.PI * 2);
          tctx.fillStyle = `rgba(255,255,255,${0.02 + Math.random() * 0.04})`;
          tctx.fill();
        }
      }
      const terrainTex = new THREE.CanvasTexture(terrainCanvas);
      terrainTex.wrapS = THREE.RepeatWrapping;
      terrainTex.wrapT = THREE.RepeatWrapping;
      terrainTex.repeat.set(4, 4);

      const terrain = new THREE.Mesh(
        new THREE.PlaneGeometry(200, 200, 32, 32),
        new THREE.MeshStandardMaterial({
          map: terrainTex, roughness: 0.95, metalness: 0.02,
          color: gColor
        })
      );
      terrain.rotation.x = -Math.PI / 2;
      terrain.position.set(p.orbitRadius, p.size + 0.02, 0);
      terrain.visible = false; // hidden by default, shown when landing
      terrain.receiveShadow = true;
      orbitGroup.add(terrain);
      p._terrain = terrain;

      // Terrain details: bigger rocks, boulders
      const terrainDetails = new THREE.Group();
      for (let bi = 0; bi < 40; bi++) {
        const boulder = new THREE.Mesh(
          new THREE.DodecahedronGeometry(0.4 + Math.random() * 1.2, 0),
          new THREE.MeshStandardMaterial({
            color: new THREE.Color(gColor).lerp(new THREE.Color(0x222222), 0.3 + Math.random() * 0.3),
            roughness: 0.95
          })
        );
        const ba = Math.random() * Math.PI * 2;
        const br = 15 + Math.random() * 70;
        boulder.position.set(
          p.orbitRadius + Math.cos(ba) * br,
          p.size + 0.1 + Math.random() * 0.4,
          Math.sin(ba) * br
        );
        boulder.rotation.set(Math.random() * Math.PI, Math.random() * Math.PI, Math.random() * Math.PI);
        boulder.castShadow = true;
        terrainDetails.add(boulder);
      }
      terrainDetails.visible = false;
      orbitGroup.add(terrainDetails);
      p._terrainDetails = terrainDetails;

      // Rocks around landing
      for (let j = 0; j < 20; j++) {
        const rockMat = new THREE.MeshStandardMaterial({
          color: new THREE.Color(p.color).lerp(new THREE.Color(0x333333), 0.5),
          roughness: 1
        });
        const rock = new THREE.Mesh(
          new THREE.DodecahedronGeometry(0.3 + Math.random() * 0.8, 0),
          rockMat
        );
        const ang = Math.random() * Math.PI * 2;
        const rad = 10 + Math.random() * 8;
        rock.position.set(
          p.orbitRadius + Math.cos(ang) * rad,
          p.size + 0.15 + Math.random() * 0.3,
          Math.sin(ang) * rad
        );
        rock.rotation.set(Math.random(), Math.random(), Math.random());
        orbitGroup.add(rock);
      }
    });

    /* ═══════════════════════════════════════════
       SHUTTLE (detailed)
    ═══════════════════════════════════════════ */
    function makeShuttle() {
      const g = new THREE.Group();

      const bodyMat = new THREE.MeshStandardMaterial({
        color: 0xd8e4ef, metalness: 0.55, roughness: 0.3
      });
      const darkMat = new THREE.MeshStandardMaterial({
        color: 0x1a2535, metalness: 0.6, roughness: 0.2
      });
      const accentMat = new THREE.MeshStandardMaterial({
        color: 0x2a5a8a, metalness: 0.5, roughness: 0.3
      });
      const glowMat = new THREE.MeshStandardMaterial({
        color: 0x5bf1ff, emissive: 0x2af0ff, emissiveIntensity: 2
      });

      // Main fuselage
      const fuselage = new THREE.Mesh(
        new THREE.CylinderGeometry(1.3, 1.6, 8, 20),
        bodyMat
      );
      fuselage.rotation.x = Math.PI / 2;
      g.add(fuselage);

      // Nose cone
      const nose = new THREE.Mesh(
        new THREE.ConeGeometry(1.3, 3.5, 20),
        bodyMat
      );
      nose.rotation.x = -Math.PI / 2;
      nose.position.z = 5.7;
      g.add(nose);

      // Cockpit window
      const cockpit = new THREE.Mesh(
        new THREE.SphereGeometry(0.9, 20, 16),
        new THREE.MeshStandardMaterial({
          color: 0x112233, metalness: 0.8, roughness: 0.1,
          emissive: 0x1a3a5a, emissiveIntensity: 0.3
        })
      );
      cockpit.scale.set(1, 0.5, 0.6);
      cockpit.position.set(0, 0.95, 2.8);
      g.add(cockpit);

      // Side windows
      for (let i = 0; i < 4; i++) {
        const win = new THREE.Mesh(
          new THREE.BoxGeometry(0.02, 0.3, 0.5),
          new THREE.MeshStandardMaterial({
            color: 0x3388cc, emissive: 0x1155aa, emissiveIntensity: 0.5,
            metalness: 0.8, roughness: 0.1
          })
        );
        win.position.set(1.3, 0.3, 1 - i * 1.2);
        g.add(win);
        const win2 = win.clone();
        win2.position.x = -1.3;
        g.add(win2);
      }

      // Main wings (delta shape)
      const wingShape = new THREE.Shape();
      wingShape.moveTo(0, 0);
      wingShape.lineTo(5.5, -1);
      wingShape.lineTo(5, -2.5);
      wingShape.lineTo(0, -3.5);
      const wingGeo = new THREE.ExtrudeGeometry(wingShape, { depth: 0.12, bevelEnabled: false });
      const leftWing = new THREE.Mesh(wingGeo, bodyMat);
      leftWing.position.set(0, -0.3, 1.5);
      leftWing.rotation.x = Math.PI / 2;
      g.add(leftWing);

      const rightWing = new THREE.Mesh(wingGeo, bodyMat);
      rightWing.position.set(0, -0.3, 1.5);
      rightWing.rotation.x = Math.PI / 2;
      rightWing.scale.x = -1;
      g.add(rightWing);

      // Vertical tail
      const tailShape = new THREE.Shape();
      tailShape.moveTo(0, 0);
      tailShape.lineTo(0.08, 2.2);
      tailShape.lineTo(-0.08, 2.2);
      tailShape.lineTo(-0.15, 0);
      const tailGeo = new THREE.ExtrudeGeometry(tailShape, { depth: 1.6, bevelEnabled: false });
      const tail = new THREE.Mesh(tailGeo, accentMat);
      tail.position.set(0, 0.5, -3.5);
      g.add(tail);

      // Horizontal stabilizers
      for (const side of [-1, 1]) {
        const stab = new THREE.Mesh(
          new THREE.BoxGeometry(2.2 * side, 0.08, 1.2),
          bodyMat
        );
        stab.position.set(side * 1.1, 0.2, -3.2);
        g.add(stab);
      }

      // Engines
      for (let i = 0; i < 3; i++) {
        const angle = (i - 1) * 0.7;
        const ex = Math.sin(angle) * 0.8;
        const ey = -0.3 + Math.cos(angle) * 0.3;

        // Engine bell
        const engine = new THREE.Mesh(
          new THREE.CylinderGeometry(0.28, 0.42, 1.4, 14),
          darkMat
        );
        engine.rotation.x = Math.PI / 2;
        engine.position.set(ex, ey, -4.5);
        g.add(engine);

        // Engine inner glow
        const engineGlow = new THREE.Mesh(
          new THREE.CylinderGeometry(0.2, 0.35, 0.3, 14),
          new THREE.MeshBasicMaterial({ color: 0xff6633 })
        );
        engineGlow.rotation.x = Math.PI / 2;
        engineGlow.position.set(ex, ey, -5.2);
        g.add(engineGlow);
      }

      // Stripe decoration
      const stripe = new THREE.Mesh(
        new THREE.BoxGeometry(3.2, 0.02, 0.15),
        accentMat
      );
      stripe.position.set(0, 1.1, 0);
      g.add(stripe);

      // LED strip lights
      for (let i = -3; i <= 3; i++) {
        const led = new THREE.Mesh(
          new THREE.SphereGeometry(0.06, 8, 8),
          glowMat
        );
        led.position.set(0, -1.55, i * 0.8);
        g.add(led);
      }

      // Landing gear (when landed)
      const gearMat = darkMat;
      for (const pos of [[0, -1.8, 2], [-1.5, -1.8, -1.5], [1.5, -1.8, -1.5]]) {
        const strut = new THREE.Mesh(
          new THREE.CylinderGeometry(0.06, 0.06, 0.6, 8),
          gearMat
        );
        strut.position.set(...pos);
        g.add(strut);
        const foot = new THREE.Mesh(
          new THREE.BoxGeometry(0.4, 0.06, 0.4),
          gearMat
        );
        foot.position.set(pos[0], pos[1] - 0.3, pos[2]);
        g.add(foot);
      }

      return g;
    }

    const shuttle = makeShuttle();
    shuttle.position.set(80, 20, 60);
    scene.add(shuttle);

    /* ═══════════════════════════════════════════
       ENGINE FLAME PARTICLES
    ═══════════════════════════════════════════ */
    const flameParticles = [];
    const flameMat = new THREE.MeshBasicMaterial({
      color: 0xff6622, transparent: true, opacity: 0.7
    });

    function createFlameParticle() {
      const p = new THREE.Mesh(
        new THREE.SphereGeometry(0.15 + Math.random() * 0.2, 6, 6),
        flameMat.clone()
      );
      p.visible = false;
      scene.add(p);
      return { mesh: p, life: 0, maxLife: 0.4 + Math.random() * 0.3, vel: new THREE.Vector3() };
    }

    for (let i = 0; i < 40; i++) {
      flameParticles.push(createFlameParticle());
    }

    let flamesActive = false;

    function updateFlames(dt) {
      if (!flamesActive) {
        flameParticles.forEach(fp => fp.mesh.visible = false);
        return;
      }

      for (const fp of flameParticles) {
        fp.life += dt;
        if (fp.life >= fp.maxLife) {
          // Reset
          fp.life = 0;
          fp.maxLife = 0.3 + Math.random() * 0.4;
          const worldPos = new THREE.Vector3();
          shuttle.getWorldPosition(worldPos);
          const backward = new THREE.Vector3(0, 0, -1).applyQuaternion(shuttle.quaternion);
          fp.mesh.position.copy(worldPos).add(backward.multiplyScalar(5.5));
          fp.mesh.position.x += (Math.random() - 0.5) * 0.8;
          fp.mesh.position.y += (Math.random() - 0.5) * 0.8;
          fp.vel.copy(backward.normalize().multiplyScalar(-(8 + Math.random() * 5)));
          fp.vel.x += (Math.random() - 0.5) * 2;
          fp.vel.y += (Math.random() - 0.5) * 2;
          fp.mesh.visible = true;
        }
        fp.mesh.position.add(fp.vel.clone().multiplyScalar(dt));
        const t = fp.life / fp.maxLife;
        fp.mesh.material.opacity = (1 - t) * 0.8;
        fp.mesh.scale.setScalar(1 + t * 2);
        const c = fp.mesh.material.color;
        c.setRGB(1, 0.3 + (1 - t) * 0.4, t * 0.3);
      }
    }

    const speedCanvas = document.getElementById("speedLines");
    const sctx = speedCanvas.getContext("2d");
    speedCanvas.width = window.innerWidth;
    speedCanvas.height = window.innerHeight;

    function drawSpeedLines(intensity) {
      sctx.clearRect(0, 0, speedCanvas.width, speedCanvas.height);
      if (intensity <= 0) return;

      const cx = speedCanvas.width / 2;
      const cy = speedCanvas.height / 2;

      for (let i = 0; i < 60 * intensity; i++) {
        const angle = Math.random() * Math.PI * 2;
        const r1 = 50 + Math.random() * 200;
        const r2 = r1 + 100 + Math.random() * 300;
        sctx.beginPath();
        sctx.moveTo(cx + Math.cos(angle) * r1, cy + Math.sin(angle) * r1);
        sctx.lineTo(cx + Math.cos(angle) * r2, cy + Math.sin(angle) * r2);
        sctx.strokeStyle = `rgba(91,241,255,${0.05 + Math.random() * 0.15 * intensity})`;
        sctx.lineWidth = 0.5 + Math.random() * 1.5;
        sctx.stroke();
      }
    }
