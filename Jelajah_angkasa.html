    /* ═══════════════════════════════════════════
       WEB AUDIO PROCEDURAL SOUND ENGINE
    ═══════════════════════════════════════════ */
    const SpaceAudio = {
      ctx: null,
      masterGain: null,
      isMuted: false,
      droneGain: null,
      droneOsc1: null,
      droneOsc2: null,
      engineNoise: null,
      engineGain: null,
      engineFilter: null,
      engineOsc1: null,
      engineOsc2: null,
      stormNoise: null,
      stormGain: null,
      stormFilter: null,
      stormLFO: null,
      stormRumbleOsc: null,
      stormRumbleGain: null,
      lastFootstepTime: 0,

      init() {
        if (this.ctx) return;
        try {
          const AudioContextClass = window.AudioContext || window.webkitAudioContext;
          if (!AudioContextClass) return;
          this.ctx = new AudioContextClass();

          // Master Gain
          this.masterGain = this.ctx.createGain();
          this.masterGain.gain.setValueAtTime(0.7, this.ctx.currentTime);
          this.masterGain.connect(this.ctx.destination);

          // 1. Cosmic Ambient Space Drone
          this.droneGain = this.ctx.createGain();
          this.droneGain.gain.setValueAtTime(0.035, this.ctx.currentTime);
          this.droneGain.connect(this.masterGain);

          this.droneOsc1 = this.ctx.createOscillator();
          this.droneOsc1.type = "sine";
          this.droneOsc1.frequency.setValueAtTime(55, this.ctx.currentTime);
          this.droneOsc1.connect(this.droneGain);
          this.droneOsc1.start();

          this.droneOsc2 = this.ctx.createOscillator();
          this.droneOsc2.type = "sine";
          this.droneOsc2.frequency.setValueAtTime(82.5, this.ctx.currentTime);
          this.droneOsc2.connect(this.droneGain);
          this.droneOsc2.start();

          // 2. Rocket Engine Roar (Jet Hiss + Low Turbine Rumble)
          this.setupEngineSound();

          // 3. Planetary Storm & Wind System
          this.setupStormSound();

        } catch (e) {
          console.warn("Audio Context init error:", e);
        }
      },

      createNoiseBuffer() {
        const bufferSize = this.ctx.sampleRate * 2;
        const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
        const output = buffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) {
          output[i] = Math.random() * 2 - 1;
        }
        return buffer;
      },

      setupEngineSound() {
        const noiseBuf = this.createNoiseBuffer();
        this.engineNoise = this.ctx.createBufferSource();
        this.engineNoise.buffer = noiseBuf;
        this.engineNoise.loop = true;

        this.engineFilter = this.ctx.createBiquadFilter();
        this.engineFilter.type = "lowpass";
        this.engineFilter.frequency.setValueAtTime(280, this.ctx.currentTime);
        this.engineFilter.Q.setValueAtTime(2.2, this.ctx.currentTime);

        this.engineGain = this.ctx.createGain();
        this.engineGain.gain.setValueAtTime(0, this.ctx.currentTime); // silent initially

        this.engineNoise.connect(this.engineFilter);
        this.engineFilter.connect(this.engineGain);

        // Low rumble oscillators for powerful rocket vibrations
        this.engineOsc1 = this.ctx.createOscillator();
        this.engineOsc1.type = "sawtooth";
        this.engineOsc1.frequency.setValueAtTime(58, this.ctx.currentTime);

        this.engineOsc2 = this.ctx.createOscillator();
        this.engineOsc2.type = "sawtooth";
        this.engineOsc2.frequency.setValueAtTime(87, this.ctx.currentTime);

        const rumbleFilter = this.ctx.createBiquadFilter();
        rumbleFilter.type = "lowpass";
        rumbleFilter.frequency.setValueAtTime(140, this.ctx.currentTime);

        this.engineOsc1.connect(rumbleFilter);
        this.engineOsc2.connect(rumbleFilter);
        rumbleFilter.connect(this.engineGain);

        this.engineGain.connect(this.masterGain);

        this.engineNoise.start();
        this.engineOsc1.start();
        this.engineOsc2.start();
      },

      setupStormSound() {
        const stormNoiseBuf = this.createNoiseBuffer();
        this.stormNoise = this.ctx.createBufferSource();
        this.stormNoise.buffer = stormNoiseBuf;
        this.stormNoise.loop = true;

        this.stormFilter = this.ctx.createBiquadFilter();
        this.stormFilter.type = "bandpass";
        this.stormFilter.frequency.setValueAtTime(350, this.ctx.currentTime);
        this.stormFilter.Q.setValueAtTime(3.0, this.ctx.currentTime);

        this.stormGain = this.ctx.createGain();
        this.stormGain.gain.setValueAtTime(0, this.ctx.currentTime); // silent initially

        this.stormNoise.connect(this.stormFilter);
        this.stormFilter.connect(this.stormGain);

        // LFO for atmospheric wind gusts
        this.stormLFO = this.ctx.createOscillator();
        this.stormLFO.type = "sine";
        this.stormLFO.frequency.setValueAtTime(0.35, this.ctx.currentTime); // natural wind swell
        const lfoGain = this.ctx.createGain();
        lfoGain.gain.setValueAtTime(140, this.ctx.currentTime);
        this.stormLFO.connect(lfoGain);
        lfoGain.connect(this.stormFilter.frequency);
        this.stormLFO.start();

        // Deep sub-bass rumble for turbulent giant planet atmospheres
        this.stormRumbleOsc = this.ctx.createOscillator();
        this.stormRumbleOsc.type = "triangle";
        this.stormRumbleOsc.frequency.setValueAtTime(42, this.ctx.currentTime);
        this.stormRumbleGain = this.ctx.createGain();
        this.stormRumbleGain.gain.setValueAtTime(0, this.ctx.currentTime);
        this.stormRumbleOsc.connect(this.stormRumbleGain);
        this.stormRumbleGain.connect(this.stormGain);
        this.stormRumbleOsc.start();

        this.stormGain.connect(this.masterGain);
        this.stormNoise.start();
      },

      startEngine() {
        if (!this.ctx) this.init();
        if (!this.ctx || !this.engineGain) return;
        const t = this.ctx.currentTime;
        this.engineGain.gain.cancelScheduledValues(t);
        this.engineGain.gain.setTargetAtTime(0.24, t, 0.2);
        this.engineFilter.frequency.cancelScheduledValues(t);
        this.engineFilter.frequency.setTargetAtTime(450, t, 0.25);
      },

      setEnginePitch(warpProgress) {
        if (!this.ctx || !this.engineFilter) return;
        const t = this.ctx.currentTime;
        const freq = 300 + warpProgress * 650;
        this.engineFilter.frequency.setValueAtTime(freq, t);
        if (this.engineOsc1) {
          this.engineOsc1.frequency.setValueAtTime(58 + warpProgress * 45, t);
          this.engineOsc2.frequency.setValueAtTime(87 + warpProgress * 68, t);
        }
      },

      stopEngine() {
        if (!this.ctx || !this.engineGain) return;
        const t = this.ctx.currentTime;
        this.engineGain.gain.cancelScheduledValues(t);
        this.engineGain.gain.setTargetAtTime(0, t, 0.35);
      },

      startPlanetStorm(profile) {
        if (!this.ctx) this.init();
        if (!this.ctx || !this.stormGain || !profile) return;
        const t = this.ctx.currentTime;
        this.stormFilter.frequency.cancelScheduledValues(t);
        this.stormFilter.frequency.setValueAtTime(profile.freq || 350, t);
        this.stormFilter.Q.setValueAtTime(profile.q || 3.0, t);

        this.stormGain.gain.cancelScheduledValues(t);
        this.stormGain.gain.setTargetAtTime(profile.gain || 0.16, t, 0.45);

        if (this.stormRumbleGain) {
          this.stormRumbleGain.gain.cancelScheduledValues(t);
          this.stormRumbleGain.gain.setTargetAtTime(profile.rumble || 0.05, t, 0.45);
        }
      },

      stopPlanetStorm() {
        if (!this.ctx || !this.stormGain) return;
        const t = this.ctx.currentTime;
        this.stormGain.gain.cancelScheduledValues(t);
        this.stormGain.gain.setTargetAtTime(0, t, 0.4);
        if (this.stormRumbleGain) {
          this.stormRumbleGain.gain.cancelScheduledValues(t);
          this.stormRumbleGain.gain.setTargetAtTime(0, t, 0.4);
        }
      },

      playLandingThud() {
        if (!this.ctx) this.init();
        if (!this.ctx) return;
        const t = this.ctx.currentTime;

        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = "sine";
        osc.frequency.setValueAtTime(130, t);
        osc.frequency.exponentialRampToValueAtTime(32, t + 0.38);

        gain.gain.setValueAtTime(0.42, t);
        gain.gain.exponentialRampToValueAtTime(0.001, t + 0.42);

        osc.connect(gain);
        gain.connect(this.masterGain);
        osc.start(t);
        osc.stop(t + 0.45);

        // Ground gravel crunch burst
        const crunch = this.ctx.createBufferSource();
        crunch.buffer = this.createNoiseBuffer();
        const filter = this.ctx.createBiquadFilter();
        filter.type = "lowpass";
        filter.frequency.setValueAtTime(420, t);
        const crunchGain = this.ctx.createGain();
        crunchGain.gain.setValueAtTime(0.25, t);
        crunchGain.gain.exponentialRampToValueAtTime(0.001, t + 0.32);

        crunch.connect(filter);
        filter.connect(crunchGain);
        crunchGain.connect(this.masterGain);
        crunch.start(t);
        crunch.stop(t + 0.35);
      },

      playFootstep() {
        if (!this.ctx) this.init();
        if (!this.ctx) return;
        const t = this.ctx.currentTime;
        if (t - this.lastFootstepTime < 0.32) return;
        this.lastFootstepTime = t;

        // Soft boot thump
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = "sine";
        osc.frequency.setValueAtTime(75 + Math.random() * 20, t);
        osc.frequency.exponentialRampToValueAtTime(28, t + 0.08);

        gain.gain.setValueAtTime(0.12, t);
        gain.gain.exponentialRampToValueAtTime(0.001, t + 0.09);

        osc.connect(gain);
        gain.connect(this.masterGain);
        osc.start(t);
        osc.stop(t + 0.1);

        // Surface dust grit scuff
        const noise = this.ctx.createBufferSource();
        noise.buffer = this.createNoiseBuffer();
        const bpf = this.ctx.createBiquadFilter();
        bpf.type = "bandpass";
        bpf.frequency.setValueAtTime(550 + Math.random() * 150, t);
        bpf.Q.setValueAtTime(2.2, t);

        const scuffGain = this.ctx.createGain();
        scuffGain.gain.setValueAtTime(0.07, t);
        scuffGain.gain.exponentialRampToValueAtTime(0.001, t + 0.07);

        noise.connect(bpf);
        bpf.connect(scuffGain);
        scuffGain.connect(this.masterGain);
        noise.start(t);
        noise.stop(t + 0.08);
      },

      playAlienChime() {
        if (!this.ctx) this.init();
        if (!this.ctx) return;
        const t = this.ctx.currentTime;
        const freqs = [196, 261.6, 392, 523.2];
        freqs.forEach((f, idx) => {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = "sine";
          osc.frequency.setValueAtTime(f, t + idx * 0.08);
          gain.gain.setValueAtTime(0.07, t + idx * 0.08);
          gain.gain.exponentialRampToValueAtTime(0.001, t + idx * 0.08 + 1.2);
          osc.connect(gain);
          gain.connect(this.masterGain);
          osc.start(t + idx * 0.08);
          osc.stop(t + idx * 0.08 + 1.3);
        });
      },

      playBeep() {
        if (!this.ctx) this.init();
        if (!this.ctx) return;
        const t = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = "sine";
        osc.frequency.setValueAtTime(880, t);
        osc.frequency.setValueAtTime(1320, t + 0.04);
        gain.gain.setValueAtTime(0.06, t);
        gain.gain.exponentialRampToValueAtTime(0.001, t + 0.1);
        osc.connect(gain);
        gain.connect(this.masterGain);
        osc.start(t);
        osc.stop(t + 0.12);
      },

      toggleSound() {
        if (!this.ctx) this.init();
        this.isMuted = !this.isMuted;
        if (this.masterGain && this.ctx) {
          const t = this.ctx.currentTime;
          this.masterGain.gain.setTargetAtTime(this.isMuted ? 0 : 0.7, t, 0.05);
        }
        const btn = document.getElementById("soundToggleBtn");
        if (btn) {
          if (this.isMuted) {
            btn.innerHTML = "🔇 SUARA OFF";
            btn.classList.add("muted");
          } else {
            btn.innerHTML = "🔊 SUARA ON";
            btn.classList.remove("muted");
          }
        }
      }
    };

    /* ═══════════════════════════════════════════
       ALIEN SPEECH SYNTHESIS (INDONESIAN TTS)
    ═══════════════════════════════════════════ */
    const AlienSpeech = {
      utterance: null,

      speak(text, onStatus) {
        if (!("speechSynthesis" in window)) {
          if (onStatus) onStatus("Browser tidak mendukung Web Speech.");
          return;
        }

        window.speechSynthesis.cancel();

        const utt = new SpeechSynthesisUtterance(text);
        utt.lang = "id-ID";

        // Search for Indonesian voice
        const voices = window.speechSynthesis.getVoices();
        const idVoice = voices.find(v => v.lang === "id-ID" || v.lang.startsWith("id") || v.lang.toLowerCase().includes("indonesia"));
        if (idVoice) utt.voice = idVoice;

        // Authoritative deep scary alien character
        utt.rate = 0.88;
        utt.pitch = 0.68;

        utt.onstart = () => {
          if (onStatus) onStatus("berbicara");
        };
        utt.onend = () => {
          if (onStatus) onStatus("selesai");
        };
        utt.onerror = () => {
          if (onStatus) onStatus("selesai");
        };

        this.utterance = utt;
        window.speechSynthesis.speak(utt);
      },

      stop() {
        if ("speechSynthesis" in window) {
          window.speechSynthesis.cancel();
        }
      }
    };

    /* ═══════════════════════════════════════════
       UI FUNCTIONS
    ═══════════════════════════════════════════ */
    function toast(text) {
      toastEl.textContent = text;
      toastEl.style.display = "block";
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => toastEl.style.display = "none", 3500);
    }

    function showInfo(p) {
      let statsHTML = "";
      if (p.stats) {
        statsHTML = '<div class="stat-grid">';
        for (const [key, val] of Object.entries(p.stats)) {
          statsHTML += `<div class="stat-item"><div class="label">${key.charAt(0).toUpperCase() + key.slice(1)}</div><div class="value">${val}</div></div>`;
        }
        statsHTML += "</div>";
      }

      infoEl.innerHTML = `
        <h3>📡 DATA EKSPEDISI: ${p.name.toUpperCase()}</h3>
        ${statsHTML}
        <p>${p.info}</p>
        <p style="margin-top:10px; padding-top:8px; border-top:1px solid rgba(255,255,255,.06)">
          <span style="color:#6a9ec5; font-size:11px">⚠ Makhluk yang ditemui adalah karakter fiksi. Fakta planet diringkas dari sumber NASA.</span>
        </p>
        <p><a href="${p.source}" target="_blank" rel="noopener">📖 Baca referensi NASA ↗</a></p>`;
      infoEl.style.display = "block";
    }

    function closeDialog() {
      dialogOpen = false;
      dialogEl.style.display = "none";
      AlienSpeech.stop();
    }

    function openAlienDialog() {
      if (!targetPlanet || dialogOpen) return;
      dialogOpen = true;

      SpaceAudio.playAlienChime();

      dialogEl.innerHTML = `
        <button class="close-btn" id="dialogCloseBtn">&times;</button>
        <div class="speaker">
          <div class="speaker-icon">👁</div>
          <div class="speaker-name">${targetPlanet.alienName} — Penghuni ${targetPlanet.name}</div>
        </div>
        <div class="alien-text">"${targetPlanet.alien}"</div>
        <div class="tts-bar">
          <div class="tts-status-box" id="ttsStatus">
            <span class="tts-pulse"></span>
            <span>🔊 Makhluk sedang berbicara...</span>
          </div>
          <div class="tts-actions">
            <button class="tts-btn" id="replayVoiceBtn">🔊 Ulangi Suara</button>
            <button class="tts-btn" id="stopVoiceBtn">⏹ Berhenti</button>
          </div>
        </div>
        <div class="note">
          ℹ️ Suara alien otomatis berbahasa Indonesia via Web Speech API. Fakta planet diverifikasi dari data NASA.
        </div>`;
      dialogEl.style.display = "block";

      const ttsStatusEl = document.getElementById("ttsStatus");
      function updateSpeechStatus(state) {
        if (!ttsStatusEl) return;
        if (state === "berbicara") {
          ttsStatusEl.innerHTML = '<span class="tts-pulse"></span><span>🔊 Makhluk sedang berbicara...</span>';
        } else {
          ttsStatusEl.innerHTML = '<span>🔇 Suara selesai</span>';
        }
      }

      // Start Indonesian speech
      AlienSpeech.speak(targetPlanet.alien, updateSpeechStatus);

      // Dialog buttons
      document.getElementById("dialogCloseBtn").addEventListener("click", closeDialog);
      document.getElementById("replayVoiceBtn").addEventListener("click", () => {
        AlienSpeech.speak(targetPlanet.alien, updateSpeechStatus);
      });
      document.getElementById("stopVoiceBtn").addEventListener("click", () => {
        AlienSpeech.stop();
        updateSpeechStatus("selesai");
      });

      showInfo(targetPlanet);
    }

    function getPlanetWorldPos(p) {
      const worldPos = new THREE.Vector3();
      p.mesh.getWorldPosition(worldPos);
      return worldPos;
    }

    function land() {
      if (!targetPlanet) return;
      mode = "walking";

      const worldPos = getPlanetWorldPos(targetPlanet);
      const surfaceY = worldPos.y + targetPlanet.size + 0.06;

      // Show terrain ground
      if (targetPlanet._terrain) targetPlanet._terrain.visible = true;
      if (targetPlanet._terrainDetails) targetPlanet._terrainDetails.visible = true;

      player.position.set(worldPos.x, surfaceY, worldPos.z);
      player.rotation.y = Math.PI * 0.55; // Face towards alien
      player.visible = true;

      // Rebuild alien with planet-specific colors
      if (alien.copy) scene.remove(alien.copy);
      const newAlien = makeAlien(targetPlanet.alienColor, targetPlanet.alienEyeColor);
      newAlien.position.set(worldPos.x + 7.5, surfaceY, worldPos.z - 3);
      newAlien.visible = true;
      scene.add(newAlien);
      alien.copy = newAlien;

      // Park shuttle realistically on the left landing sector (not blocking camera)
      shuttle.position.set(worldPos.x - 13, surfaceY + 1.8, worldPos.z - 2);
      shuttle.rotation.set(0, Math.PI * 0.25, 0);

      // Frame camera cleanly behind player looking towards alien and horizon
      camera.position.set(worldPos.x - 1.5, surfaceY + 3.6, worldPos.z + 7.5);
      camera.lookAt(worldPos.x + 3, surfaceY + 1.5, worldPos.z - 2);

      flamesActive = false;

      // 1. DAYTIME ATMOSPHERE & SKY WHEN LANDED
      scene.background = new THREE.Color(targetPlanet.skyColor);
      scene.fog = new THREE.FogExp2(targetPlanet.fogColor, targetPlanet.fogDensity || 0.009);

      // 2. DAYTIME ILLUMINATION
      landingLight.color.setHex(targetPlanet.sunLightColor || 0xffffff);
      landingLight.intensity = 4.5;
      landingLight.position.set(worldPos.x, surfaceY + 20, worldPos.z);

      ambientLight.color.setHex(targetPlanet.skyColor);
      ambientLight.intensity = 2.6;

      hemiLight.color.setHex(targetPlanet.skyColor);
      hemiLight.groundColor.setHex(targetPlanet.color);
      hemiLight.intensity = 2.0;

      // 3. SOUND EFFECTS (LANDING THUD & PLANET STORM/WIND)
      SpaceAudio.playLandingThud();
      SpaceAudio.startPlanetStorm(targetPlanet.windProfile);

      statusEl.textContent = `🚶 Berjalan di ${targetPlanet.name} (Siang Hari)`;
      actionBtn.textContent = "💬 BICARA (E)";
      returnBtn.style.display = "block";
      toast(`Taufik mendarat di siang hari ${targetPlanet.name}! [${targetPlanet.windProfile ? targetPlanet.windProfile.name : "Suasana Planet"}]`);
    }

    function startFlight(p) {
      if (mode === "traveling") {
        toast("Pesawat sedang dalam perjalanan!");
        return;
      }
      if (mode === "walking") {
        toast("Kembali ke pesawat terlebih dahulu (tekan R).");
        return;
      }

      closeDialog();

      // Clean up previous alien
      if (alien.copy) {
        scene.remove(alien.copy);
        alien.copy = null;
      }

      targetPlanet = p;
      mode = "traveling";
      infoEl.style.display = "none";
      returnBtn.style.display = "none";

      const targetWorldPos = getPlanetWorldPos(p);
      const start = shuttle.position.clone();
      const end = targetWorldPos.clone().add(new THREE.Vector3(0, p.size + 12, 15));

      const mid = start.clone().lerp(end, 0.5);
      mid.y += 50 + start.distanceTo(end) * 0.15;

      flight = { start, end, mid, time: 0, duration: 5.5, planet: p };
      flamesActive = true;

      // Start rocket engine roar sound & UI beep
      SpaceAudio.playBeep();
      SpaceAudio.startEngine();

      fuel = Math.max(10, fuel - 8);
      fuelBar.style.width = fuel + "%";

      statusEl.textContent = `🚀 Terbang menuju ${p.name}...`;
      actionBtn.textContent = "⏳ DALAM PERJALANAN...";
      toast(`Perjalanan menuju ${p.name} dimulai! Deru mesin roket menyala.`);
    }

    function returnToOrbit() {
      if (mode !== "walking") return;
      closeDialog();
      player.visible = false;
      if (alien.copy) {
        scene.remove(alien.copy);
        alien.copy = null;
      }
      alien.visible = false;
      mode = "space";
      infoEl.style.display = "none";

      // Hide terrain
      if (targetPlanet._terrain) targetPlanet._terrain.visible = false;
      if (targetPlanet._terrainDetails) targetPlanet._terrainDetails.visible = false;

      // Stop storm wind sound & speech
      SpaceAudio.stopPlanetStorm();
      AlienSpeech.stop();

      // Restore dark space background & remove fog
      scene.background.setHex(0x000005);
      scene.fog = null;

      // Restore space lighting
      landingLight.intensity = 0;
      ambientLight.color.setHex(0x3a5070);
      ambientLight.intensity = 1.2;
      hemiLight.color.setHex(0x88aadd);
      hemiLight.groundColor.setHex(0x445566);
      hemiLight.intensity = 0.8;

      const worldPos = getPlanetWorldPos(targetPlanet);
      shuttle.position.set(worldPos.x, worldPos.y + targetPlanet.size + 12, worldPos.z + 15);

      statusEl.textContent = `📍 Mengorbit dekat ${targetPlanet.name}`;
      actionBtn.textContent = "🪐 PILIH PLANET";
      returnBtn.style.display = "none";
      toast("Taufik kembali ke orbit luar angkasa.");
    }

    /* ═══════════════════════════════════════════
       PLANET BUTTONS
    ═══════════════════════════════════════════ */
    planets.forEach(p => {
      const btn = document.createElement("button");
      btn.className = "planetBtn";
      const dot = document.createElement("span");
      dot.className = "dot";
      dot.style.background = "#" + new THREE.Color(p.color).getHexString();
      btn.appendChild(dot);
      btn.appendChild(document.createTextNode(p.name));
      btn.addEventListener("click", () => startFlight(p));
      document.getElementById("planetList").appendChild(btn);
    });

    /* ═══════════════════════════════════════════
       EVENT HANDLERS
    ═══════════════════════════════════════════ */
    actionBtn.addEventListener("click", () => {
      if (mode === "walking") {
        if (alien.copy) {
          const dx = player.position.x - alien.copy.position.x;
          const dz = player.position.z - alien.copy.position.z;
          if (Math.hypot(dx, dz) < 12) openAlienDialog();
          else toast("Dekati penghuni planet terlebih dahulu.");
        }
      } else if (mode === "orbiting") {
        land();
      }
    });

    returnBtn.addEventListener("click", returnToOrbit);

    window.addEventListener("keydown", e => {
      keys[e.key.toLowerCase()] = true;

      if (e.key.toLowerCase() === "e") {
        if (mode === "orbiting") land();
        else if (mode === "walking" && alien.copy) {
          const dx = player.position.x - alien.copy.position.x;
          const dz = player.position.z - alien.copy.position.z;
          if (Math.hypot(dx, dz) < 12) openAlienDialog();
          else toast("Dekati penghuni planet terlebih dahulu.");
        }
      }

      if (e.key.toLowerCase() === "r" && mode === "walking") {
        returnToOrbit();
      }

      if (e.key.toLowerCase() === "m") {
        SpaceAudio.toggleSound();
      }

      if (e.key === "Escape") closeDialog();
    });

    window.addEventListener("keyup", e => keys[e.key.toLowerCase()] = false);

    // Sound toggle button in topbar
    const soundBtn = document.getElementById("soundToggleBtn");
    if (soundBtn) {
      soundBtn.addEventListener("click", () => SpaceAudio.toggleSound());
    }

    // Touch controls
    document.querySelectorAll(".touch-btn").forEach(btn => {
      const key = btn.dataset.key;
      btn.addEventListener("touchstart", e => { e.preventDefault(); keys[key] = true; });
      btn.addEventListener("touchend", e => { e.preventDefault(); keys[key] = false; });
      btn.addEventListener("mousedown", () => keys[key] = true);
      btn.addEventListener("mouseup", () => keys[key] = false);
    });

    /* ═══════════════════════════════════════════
       CAMERA
    ═══════════════════════════════════════════ */
    camera.position.set(0, 120, 420);
    camera.lookAt(0, 0, 0);

    /* ═══════════════════════════════════════════
       AUDIO INITIALIZATION (On first user gesture)
    ═══════════════════════════════════════════ */
    function triggerAudioInit() {
      SpaceAudio.init();
    }
    document.addEventListener("click", triggerAudioInit, { once: true });
    document.addEventListener("touchstart", triggerAudioInit, { once: true });
    document.addEventListener("keydown", triggerAudioInit, { once: true });

    /* ═══════════════════════════════════════════
       LOADING
    ═══════════════════════════════════════════ */
    let loadProgress = 0;
    const loadInterval = setInterval(() => {
      loadProgress += 3 + Math.random() * 8;
      if (loadProgress >= 100) {
        loadProgress = 100;
        clearInterval(loadInterval);
        loadBar.style.width = "100%";
        setTimeout(() => {
          document.getElementById("loading").classList.add("fade");
          document.getElementById("hud").style.display = "block";
          statusEl.textContent = "🛸 Pilih planet tujuan untuk memulai ekspedisi.";
          setTimeout(() => {
            document.getElementById("loading").remove();
          }, 1000);
        }, 400);
      }
      loadBar.style.width = loadProgress + "%";
    }, 80);

    /* ═══════════════════════════════════════════
       ANIMATION LOOP
    ═══════════════════════════════════════════ */
    const clock = new THREE.Clock();
    let elapsedTotal = 0;

    function animate() {
      requestAnimationFrame(animate);
      const dt = Math.min(clock.getDelta(), 0.05);
      elapsedTotal += dt;

      // Sun rotation & pulse
      sun.mesh.rotation.y += dt * 0.03;
      const pulse = 1 + Math.sin(elapsedTotal * 2) * 0.02;
      sun.glows.forEach((g, i) => {
        g.scale.setScalar(pulse + i * 0.005 * Math.sin(elapsedTotal * (3 + i)));
      });

      // Planet orbits & rotation
      planets.forEach((p, i) => {
        // Only orbit when not walking on this planet
        if (mode !== "walking" || targetPlanet !== p) {
          p._orbitAngle += p.orbitSpeed * dt * 0.1;
          p.orbitGroup.rotation.y = p._orbitAngle;
        }

        // Planet self-rotation
        p.mesh.rotation.y += p.rotSpeed;

        // Moon orbit for Earth
        if (p._moon) {
          p._moon.position.x = 12 * Math.cos(elapsedTotal * 0.5);
          p._moon.position.z = 12 * Math.sin(elapsedTotal * 0.5);
        }
      });

      // Star twinkle
      if (stars2.material) {
        stars2.material.opacity = 0.4 + Math.sin(elapsedTotal * 0.5) * 0.2;
      }

      // Follow light in space mode tracks shuttle
      if (mode === "traveling" || mode === "orbiting" || mode === "space") {
        followLight.position.copy(shuttle.position).add(new THREE.Vector3(0, 10, 5));
      }

      // Flight animation
      if (mode === "traveling" && flight) {
        flight.time += dt;
        const t = Math.min(flight.time / flight.duration, 1);
        const eased = t < 0.5
          ? 4 * t * t * t
          : 1 - Math.pow(-2 * t + 2, 3) / 2;

        // Recalculate target position (planet is orbiting)
        const currentTargetPos = getPlanetWorldPos(flight.planet);
        flight.end.copy(currentTargetPos).add(new THREE.Vector3(0, flight.planet.size + 12, 15));
        flight.mid.copy(flight.start).lerp(flight.end, 0.5);
        flight.mid.y = Math.max(flight.mid.y, 50 + flight.start.distanceTo(flight.end) * 0.12);

        // Quadratic bezier
        const p1 = flight.start.clone().lerp(flight.mid, eased);
        const p2 = flight.mid.clone().lerp(flight.end, eased);
        shuttle.position.copy(p1.clone().lerp(p2, eased));

        // Orient shuttle toward destination
        const lookTarget = p2.clone();
        const dir = lookTarget.sub(shuttle.position).normalize();
        if (dir.length() > 0.01) {
          shuttle.lookAt(shuttle.position.clone().add(dir));
        }

        // Camera follows shuttle
        const camOffset = new THREE.Vector3(0, 10, 25);
        camOffset.applyQuaternion(shuttle.quaternion);
        const camTarget = shuttle.position.clone().add(camOffset);
        camera.position.lerp(camTarget, 0.04);
        camera.lookAt(shuttle.position);

        // Speed lines
        speedCanvas.style.opacity = Math.min(1, eased * 2) * (1 - Math.max(0, (t - 0.7) / 0.3));
        drawSpeedLines(eased * (1 - Math.max(0, (t - 0.8) / 0.2)));

        // Modulate engine sound pitch based on flight curve
        SpaceAudio.setEnginePitch(eased);

        // Fuel drain
        fuel = Math.max(5, 100 - t * 15);
        fuelBar.style.width = fuel + "%";

        if (t >= 1) {
          flight = null;
          mode = "orbiting";
          flamesActive = false;
          SpaceAudio.stopEngine();
          speedCanvas.style.opacity = "0";
          statusEl.textContent = `🛰 Tiba di dekat ${targetPlanet.name}`;
          actionBtn.textContent = "🔽 MENDARAT (E)";
          toast(`Tiba di ${targetPlanet.name}! Tekan E untuk keluar dari pesawat.`);
        }
      }

      // Orbiting camera
      if (mode === "orbiting" && targetPlanet) {
        const planetPos = getPlanetWorldPos(targetPlanet);
        const desired = planetPos.clone().add(new THREE.Vector3(
          Math.sin(elapsedTotal * 0.15) * 20,
          12 + Math.sin(elapsedTotal * 0.1) * 3,
          25 + Math.cos(elapsedTotal * 0.15) * 10
        ));
        camera.position.lerp(desired, 0.03);
        camera.lookAt(planetPos);
      }

      // Walking
      if (mode === "walking") {
        const speed = 8 * dt;
        let mx = 0, mz = 0;
        if (keys.w || keys.arrowup) mz -= 1;
        if (keys.s || keys.arrowdown) mz += 1;
        if (keys.a || keys.arrowleft) mx -= 1;
        if (keys.d || keys.arrowright) mx += 1;

        const isMoving = mx !== 0 || mz !== 0;

        if (isMoving) {
          const len = Math.hypot(mx, mz);
          mx /= len; mz /= len;
          player.position.x += mx * speed;
          player.position.z += mz * speed;
          player.rotation.y = Math.atan2(mx, mz);

          // Walk bob & footsteps sound
          walkAnimTime += dt * 8;
          SpaceAudio.playFootstep();
        }

        // Constrain to landing area (bigger area now with terrain)
        const planetPos = getPlanetWorldPos(targetPlanet);
        const dx = player.position.x - planetPos.x;
        const dz = player.position.z - planetPos.z;
        const distance = Math.hypot(dx, dz);

        if (distance > 80) {
          player.position.x = planetPos.x + dx / distance * 80;
          player.position.z = planetPos.z + dz / distance * 80;
        }

        // Keep on planet surface
        const surfaceY = planetPos.y + targetPlanet.size + 0.06;
        player.position.y = surfaceY + (isMoving ? Math.sin(walkAnimTime) * 0.04 : 0);

        // Follow light tracks player
        followLight.position.set(player.position.x, surfaceY + 12, player.position.z + 5);

        // Camera follows player — lower angle to see ground
        const camTarget = player.position.clone().add(new THREE.Vector3(0, 3.5, 8));
        camera.position.lerp(camTarget, 0.08);
        camera.lookAt(player.position.clone().add(new THREE.Vector3(0, 1.2, 0)));

        // Alien idle animation
        if (alien.copy) {
          alien.copy.rotation.y = Math.sin(elapsedTotal * 0.4) * 0.3;
          // Alien bobs menacingly
          alien.copy.position.y = planetPos.y + targetPlanet.size + 0.06 + Math.sin(elapsedTotal * 1.5) * 0.08;

          // Keep alien on planet surface too
          const alienDx = alien.copy.position.x - planetPos.x;
          const alienDz = alien.copy.position.z - planetPos.z;
          const alienDist = Math.hypot(alienDx, alienDz);
          if (alienDist > 14) {
            alien.copy.position.x = planetPos.x + alienDx / alienDist * 14;
            alien.copy.position.z = planetPos.z + alienDz / alienDist * 14;
          }

          // Alien faces player
          const toPlayer = new THREE.Vector2(
            player.position.x - alien.copy.position.x,
            player.position.z - alien.copy.position.z
          );
          alien.copy.rotation.y = Math.atan2(toPlayer.x, toPlayer.y);
        }
      }

      // Space overview camera
      if (mode === "space") {
        const spaceTarget = new THREE.Vector3(
          Math.sin(elapsedTotal * 0.02) * 30,
          100 + Math.sin(elapsedTotal * 0.03) * 15,
          380 + Math.cos(elapsedTotal * 0.02) * 30
        );
        camera.position.lerp(spaceTarget, 0.008);
        camera.lookAt(0, 0, 0);
      }

      // Engine flames
      updateFlames(dt);

      renderer.render(scene, camera);
    }

    animate();

    /* ═══════════════════════════════════════════
       RESIZE
    ═══════════════════════════════════════════ */
    window.addEventListener("resize", () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
      speedCanvas.width = window.innerWidth;
      speedCanvas.height = window.innerHeight;
    });
  </script>
</body>
</html>
